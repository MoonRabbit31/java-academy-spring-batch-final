# ============================================
# MySQL Configuration
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/academia
spring.datasource.username=alumno
spring.datasource.password=alumno123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# Spring Batch Configuration
# ============================================
# Inicializar siempre el esquema de Spring Batch
spring.batch.jdbc.initialize-database=always
# Ejecutar el Job al arrancar la aplicación
spring.batch.job.enabled=false

# ============================================
# MongoDB Configuration
# ============================================
spring.data.mongodb.uri=mongodb://root:root123@localhost:27017/academia?authSource=admin

# ============================================
# JPA/Hibernate Configuration (para MySQL)
# ============================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ============================================
# Logging Configuration
# ============================================
logging.level.root=INFO
logging.level.com.academia=DEBUG
logging.level.org.springframework.batch=INFO
